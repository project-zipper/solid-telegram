
name: Build 90 Popular Places

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build place XML files
        run: |
          python -m pip install requests

          mkdir -p places

          cat > build.py <<'PY'
          import requests
          import xml.etree.ElementTree as ET
          import time
          import os
          import re

          places = [
              "Eiffel Tower",
              "Statue of Liberty",
              "Big Ben",
              "Colosseum",
              "Great Wall of China",
              "Taj Mahal",
              "Mount Everest",
              "Machu Picchu",
              "Pyramids of Giza",
              "Christ the Redeemer",
              "Sydney Opera House",
              "Burj Khalifa",
              "Tower Bridge",
              "Louvre",
              "Times Square",
              "Central Park",
              "Golden Gate Bridge",
              "Empire State Building",
              "Hollywood Sign",
              "Niagara Falls",
              "Grand Canyon",
              "Yellowstone National Park",
              "Yosemite National Park",
              "Disneyland",
              "Walt Disney World",
              "Universal Studios Hollywood",
              "Las Vegas Strip",
              "Mount Rushmore",
              "White House",
              "Lincoln Memorial",
              "Washington Monument",
              "Notre-Dame de Paris",
              "Arc de Triomphe",
              "Palace of Versailles",
              "Leaning Tower of Pisa",
              "Trevi Fountain",
              "Vatican Museums",
              "St Peter's Basilica",
              "Sagrada Familia",
              "Park Guell",
              "Acropolis of Athens",
              "Santorini",
              "Stonehenge",
              "Buckingham Palace",
              "London Eye",
              "Edinburgh Castle",
              "Neuschwanstein Castle",
              "Brandenburg Gate",
              "Berlin Wall",
              "Red Square",
              "Saint Basil's Cathedral",
              "Hagia Sophia",
              "Blue Mosque",
              "Petra",
              "Burj Al Arab",
              "Palm Jumeirah",
              "Mecca",
              "Medina",
              "Angkor Wat",
              "Borobudur",
              "Mount Fuji",
              "Tokyo Tower",
              "Tokyo Skytree",
              "Fushimi Inari-taisha",
              "Kinkaku-ji",
              "Osaka Castle",
              "Shibuya Crossing",
              "Forbidden City",
              "Tiananmen Square",
              "Shanghai Tower",
              "Terracotta Army",
              "Victoria Harbour",
              "Marina Bay Sands",
              "Gardens by the Bay",
              "Petronas Towers",
              "Batu Caves",
              "Bali",
              "Ha Long Bay",
              "Angkor Thom",
              "Chichen Itza",
              "Teotihuacan",
              "Iguazu Falls",
              "Copacabana Beach",
              "Amazon Rainforest",
              "Table Mountain",
              "Victoria Falls",
              "Serengeti National Park",
              "Great Barrier Reef",
              "Uluru"
          ]

          headers = {
              "User-Agent": "PopularPlacesXMLBuilder/1.0 (GitHub Actions)"
          }

          session = requests.Session()
          session.headers.update(headers)

          def search_place(name):
              url = "https://www.wikidata.org/w/api.php"
              params = {
                  "action": "wbsearchentities",
                  "search": name,
                  "language": "en",
                  "format": "json",
                  "limit": 5
              }

              response = session.get(url, params=params, timeout=30)
              response.raise_for_status()

              results = response.json().get("search", [])

              for result in results:
                  qid = result.get("id", "")
                  if re.fullmatch(r"Q[0-9]+", qid):
                      return qid

              return None

          qids = {}
          for name in places:
              try:
                  qid = search_place(name)
                  if qid:
                      qids[qid] = name
                  print("Found:", name, qid)
              except Exception as error:
                  print("Search failed:", name, error)

              time.sleep(0.2)

          def get_claim(claims, property_id):
              values = claims.get(property_id, [])
              if not values:
                  return None
              return values[0].get("mainsnak", {}).get(
                  "datavalue", {}
              ).get("value")

          ids = list(qids.keys())
          records = []

          for start in range(0, len(ids), 50):
              batch = ids[start:start + 50]

              response = session.get(
                  "https://www.wikidata.org/w/api.php",
                  params={
                      "action": "wbgetentities",
                      "ids": "|".join(batch),
                      "props": "labels|descriptions|claims",
                      "languages": "en",
                      "format": "json"
                  },
                  timeout=60
              )
              response.raise_for_status()

              entities = response.json().get("entities", {})

              for qid in batch:
                  entity = entities.get(qid, {})
                  labels = entity.get("labels", {})
                  descriptions = entity.get("descriptions", {})
                  claims = entity.get("claims", {})

                  label = labels.get("en", {}).get("value", qids[qid])
                  description = descriptions.get("en", {}).get(
                      "value", "Popular place"
                  )

                  coordinate = get_claim(claims, "P625")
                  if not coordinate:
                      print("No coordinates:", label)
                      continue

                  latitude = coordinate.get("latitude")
                  longitude = coordinate.get("longitude")

                  if latitude is None or longitude is None:
                      continue

                  image = get_claim(claims, "P18")
                  photo_url = ""
                  photo_page = ""

                  if image:
                      filename = requests.utils.quote(
                          image.replace(" ", "_"), safe=""
                      )
                      photo_url = (
                          "https://commons.wikimedia.org/wiki/"
                          "Special:FilePath/" + filename
                      )
                      photo_page = (
                          "https://commons.wikimedia.org/wiki/File:"
                          + requests.utils.quote(image.replace(" ", "_"))
                      )

                  root = ET.Element("place")
                  fields = {
                      "id": qid,
                      "name": label,
                      "category": "Popular place",
                      "description": description,
                      "latitude": str(latitude),
                      "longitude": str(longitude),
                      "photo": photo_url,
                      "photo_page": photo_page,
                      "photo_license": (
                          "Check the individual Wikimedia Commons file page"
                          if image else ""
                      ),
                      "source": "Wikidata",
                      "source_url": (
                          "https://www.wikidata.org/wiki/" + qid
                      )
                  }

                  for key, value in fields.items():
                      child = ET.SubElement(root, key)
                      child.text = value

                  ET.indent(root, space="  ")

                  filename = f"places/{qid}.xml"
                  ET.ElementTree(root).write(
                      filename,
                      encoding="utf-8",
                      xml_declaration=True
                  )

                  records.append((qid, label))
                  print("Created:", filename)

          index = ET.Element("places")
          index.set("count", str(len(records)))

          for qid, label in records:
              item = ET.SubElement(index, "place")
              item.set("id", qid)
              item.set("name", label)
              item.set("file", qid + ".xml")

          ET.indent(index, space="  ")
          ET.ElementTree(index).write(
              "places/index.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          print("Total XML files created:", len(records))
          PY

          python build.py

      - name: Save XML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add places/
          git commit -m "Build popular places XML database" || echo "No changes"
          git push
